name: Update Web Flasher from Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-webflasher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release: $TAG"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          rm -rf /tmp/indy-release
          mkdir -p /tmp/indy-release
          gh release download "$TAG" \
            --pattern 'indy-open-igate-v*.bin' \
            --pattern 'indy-open-tracker-v*.bin' \
            --pattern 'indy-open-tnc-v*.hex' \
            --dir /tmp/indy-release || true
          find /tmp/indy-release -maxdepth 1 -type f -printf '%f\n' || true

      - name: Update iGate Web Flasher
        run: |
          BIN="$(find /tmp/indy-release -maxdepth 1 -type f -name 'indy-open-igate-v*.bin' | head -n 1)"
          if [ -n "$BIN" ]; then
            mkdir -p webflasher/firmware
            cp "$BIN" webflasher/firmware/indy-open-igate-latest.bin
            VERSION="$(basename "$BIN" | sed -E 's/^indy-open-igate-v(.+)\.bin$/\1/')"
            VERSION="$VERSION" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('webflasher/manifest-igate.json')
          d=json.loads(p.read_text())
          d['version']=os.environ['VERSION']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          else
            echo "Sin firmware iGate en este Release."
          fi

      - name: Update Tracker Web Flasher
        run: |
          BIN="$(find /tmp/indy-release -maxdepth 1 -type f -name 'indy-open-tracker-v*.bin' | head -n 1)"
          if [ -n "$BIN" ]; then
            mkdir -p webflasher/firmware
            cp "$BIN" webflasher/firmware/indy-open-tracker-latest.bin
            VERSION="$(basename "$BIN" | sed -E 's/^indy-open-tracker-v(.+)\.bin$/\1/')"
            VERSION="$VERSION" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('webflasher/manifest-tracker.json')
          d=json.loads(p.read_text())
          d['version']=os.environ['VERSION']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          else
            echo "Sin firmware Tracker en este Release."
          fi

      - name: Update TNC fallback if present
        run: |
          HEX="$(find /tmp/indy-release -maxdepth 1 -type f -name 'indy-open-tnc-v*.hex' | head -n 1)"
          if [ -n "$HEX" ]; then
            mkdir -p tnc-webflasher/firmware
            cp "$HEX" tnc-webflasher/firmware/indy-open-tnc-latest.hex
          fi

      - name: Commit updated Web Flashers
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webflasher/manifest-igate.json webflasher/manifest-tracker.json 2>/dev/null || true
          git add webflasher/firmware/indy-open-igate-latest.bin 2>/dev/null || true
          git add webflasher/firmware/indy-open-tracker-latest.bin 2>/dev/null || true
          git add tnc-webflasher/firmware/indy-open-tnc-latest.hex 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update Web Flashers from $TAG"
          git push
